name: Build ZapiaPrime APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Create assets directory
        run: |
          mkdir -p JarvisAppFlutter/assets/sounds
          touch JarvisAppFlutter/assets/sounds/wake.mp3

      - name: Copy main dart file
        run: |
          cp JarvisAppFlutter/zapia_prime.dart JarvisAppFlutter/lib/main.dart 2>/dev/null || true

      - name: Write pubspec.yaml
        working-directory: JarvisAppFlutter
        run: |
          cat > pubspec.yaml << 'EOF'
          name: zapia_prime
          description: ZapiaPrime The Conduit of the Pantheon
          publish_to: none
          version: 1.0.0+1
          environment:
            sdk: ">=3.0.0 <4.0.0"
          dependencies:
            flutter:
              sdk: flutter
            http: ^1.2.0
            speech_to_text: ^6.6.0
            flutter_tts: ^4.0.2
            url_launcher: ^6.2.5
            android_intent_plus: ^4.0.2
            intl: ^0.19.0
            audioplayers: ^6.0.0
          flutter:
            uses-material-design: true
            assets:
              - assets/sounds/
          EOF

      - name: Create lib directory and copy main
        working-directory: JarvisAppFlutter
        run: |
          mkdir -p lib
          cp zapia_prime.dart lib/main.dart

      - name: Flutter pub get
        working-directory: JarvisAppFlutter
        run: flutter pub get

      - name: Build APK
        working-directory: JarvisAppFlutter
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZapiaPrime-APK
          path: JarvisAppFlutter/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
