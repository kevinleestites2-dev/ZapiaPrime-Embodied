name: Build ZapiaPrime APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Create new Flutter project scaffold
        run: |
          flutter create --org com.pantheon --project-name zapia_prime zapia_build
          cd zapia_build
          # Enable android build
          flutter config --enable-android

      - name: Inject ZapiaPrime source
        run: |
          cp JarvisAppFlutter/zapia_prime.dart zapia_build/lib/main.dart

      - name: Write pubspec.yaml with dependencies
        working-directory: zapia_build
        run: |
          cat > pubspec.yaml << 'PUBEOF'
          name: zapia_prime
          description: ZapiaPrime - The Conduit of the Pantheon
          publish_to: none
          version: 1.0.0+1
          environment:
            sdk: ">=3.0.0 <4.0.0"
          dependencies:
            flutter:
              sdk: flutter
            http: ^1.2.0
            speech_to_text: ^6.6.0
            flutter_tts: ^4.0.2
            url_launcher: ^6.2.5
            android_intent_plus: ^4.0.2
            intl: ^0.19.0
            audioplayers: ^6.0.0
          flutter:
            uses-material-design: true
            assets:
              - assets/sounds/
          PUBEOF

      - name: Create assets directory with placeholder sound
        working-directory: zapia_build
        run: |
          mkdir -p assets/sounds
          # Create a minimal valid MP3 (silence) so asset exists
          printf '\xff\xfb\x90\x00' > assets/sounds/wake.mp3

      - name: Add android permissions to AndroidManifest
        working-directory: zapia_build
        run: |
          # Inject required permissions before </manifest>
          sed -i 's|<uses-permission android:name="android.permission.INTERNET"/>||g' android/app/src/main/AndroidManifest.xml
          sed -i 's|<manifest|<manifest xmlns:tools="http://schemas.android.com/tools"|g' android/app/src/main/AndroidManifest.xml
          sed -i 's|</manifest>|    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>\n    <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30"/>\n    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT"/>\n    <uses-permission android:name="android.permission.VIBRATE"/>\n    <uses-feature android:name="android.hardware.microphone" android:required="true"/>\n</manifest>|g' android/app/src/main/AndroidManifest.xml

      - name: Set minimum SDK version
        working-directory: zapia_build
        run: |
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' android/app/build.gradle.kts || \
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/' android/app/build.gradle

      - name: Flutter pub get
        working-directory: zapia_build
        run: flutter pub get

      - name: Build release APK
        working-directory: zapia_build
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZapiaPrime-APK
          path: zapia_build/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
